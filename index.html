<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discovery Assistant Prototyp</title>
  <link rel="stylesheet" href="src/styles.css?v=20261104-state-wait">
</head>
<body>
<nav class="statebar" aria-label="Prototyp-Zustände">
  <p>Prototyp · Zustand</p>
  <div class="statebuttons" id="states">
    <button type="button" data-j="cold-on" aria-pressed="true">Cold Start</button>
    <button type="button" data-j="wait" aria-pressed="false">Waiting</button>
    <button type="button" data-j="high" aria-pressed="false">High</button>
    <button type="button" data-j="low" aria-pressed="false">Low</button>
    <button type="button" data-j="none" aria-pressed="false">No Result</button>
    <button type="button" data-j="fail" aria-pressed="false">Failure</button>
  </div>
</nav>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <details class="mod" id="mod">
    <summary>Moderation</summary>
    <div class="modbox">
      <div>Nur für die Testleitung. Springt direkt in einen Zustand.</div>
      <div class="chips" id="jump"></div>
      <label><span>Nächstes KI-Ergebnis</span>
        <select id="scenario">
          <option value="auto">Automatisch (nach Suchtext)</option>
          <option value="high">High Confidence</option>
          <option value="low">Low Confidence</option>
          <option value="none">No Result</option>
          <option value="fail">Failure (sofort)</option>
          <option value="slow">Langsam: Fehler nach 15 s</option>
        </select>
      </label>
      <p class="muted" style="font-size:12px;color:var(--ink2)">Prototyp mit erfundenen Daten. Es läuft kein echtes Modell. Getestet wird die Oberfläche um das Modell.</p>
    </div>
  </details>
</div>

  <script src="src/app.js?v=20261104-state-wait"></script>
</body>
</html>
