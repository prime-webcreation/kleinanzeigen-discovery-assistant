<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Discovery Assistant Prototyp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <details class="mod" id="mod">
    <summary>Moderation</summary>
    <div class="modbox">
      <div>Nur für die Testleitung. Springt direkt in einen Zustand.</div>
      <div class="chips" id="jump"></div>
      <label><span>Nächstes KI-Ergebnis</span>
        <select id="scenario">
          <option value="auto">Automatisch (nach Suchtext)</option>
          <option value="high">High Confidence</option>
          <option value="low">Low Confidence</option>
          <option value="none">No Result</option>
          <option value="fail">Failure (sofort)</option>
          <option value="slow">Langsam: Abbrechen nach 6 s, Fehler nach 15 s</option>
        </select>
      </label>
      <p class="muted" style="font-size:12px;color:var(--ink2)">Prototyp mit erfundenen Daten. Es läuft kein echtes Modell. Getestet wird die Oberfläche um das Modell.</p>
    </div>
  </details>
</div>

  <script src="app.js"></script>
</body>
</html>
